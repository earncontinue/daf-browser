# =============================================================================
# DAF Browser fork — CHAINED RELEASE BUILD.
#
# Runs ONE time-boxed hop of the full chrome_public_apk build, resuming from
# the previous hop's state. The chain is the mechanism that gets a full
# Chromium build through the 6-hour free-runner cap: each hop builds for
# ~265 minutes, packages out/ as state, and the next hop resumes from it.
# Modelled on iNWEB-Browser's b001-build-hop.yml (14 chained hops, ~45 h).
#
# GATE: this workflow runs ONLY after the hinge has run. Its first step
# downloads the `daf-verdict` artifact from the run named by `prev_run_id`
# and refuses to start unless that verdict is HINGE_TIMEOUT or HOP_TIMEOUT
# (a previous run that produced resumable state). It refuses on:
#   HINGE_DEAD / HOP_FAILED / HINGE_BLOCKED / HOP_BLOCKED — a real failure;
#     the $0 path is dead or the build is broken. Do not resume.
#   HINGE_PASSED / HOP_DONE — the build already completed; the APK is in
#     that run's artifacts. Nothing to resume.
#   anything else / no verdict artifact — no hinge state exists; run the
#     hinge workflow first.
#
# Trigger: Actions -> "DAF fork — chained release build" -> Run workflow,
# with `prev_run_id` = the run ID of the hinge run (hop 1) or of the previous
# hop, and `hop_number` = this hop's number. One hop at a time (concurrency
# group `daf-build`); never run two hops in parallel — the state would fork.
#
# Outcomes (verdict uploaded as `daf-verdict`, state as `daf-state-part-*`):
#   HOP_DONE    — the APK was produced (and signed, if the keystore secrets
#                 exist). The link completed: the $0 path is proven.
#   HOP_TIMEOUT — the time box expired; the state is packaged for the next hop.
#   HOP_FAILED  — a real build failure. No state is uploaded (re-running the
#                 same failing step would fail again); the log is uploaded.
#   HOP_BLOCKED — the state no longer fits the 8-part (32 GiB) upload scheme.
# =============================================================================
name: DAF fork — chained release build

on:
  workflow_dispatch:
    inputs:
      prev_run_id:
        description: "Run ID of the hinge run (hop 1) or the previous hop whose state to resume from"
        required: true
        type: string
      hop_number:
        description: "Hop number (1 = first hop after the hinge)"
        required: true
        type: number
      hop_minutes:
        description: "Time box for the ninja run, in minutes (iNWEB: 265)"
        required: false
        default: "265"
        type: string
      ninja_jobs:
        description: "ninja -j parallelism (4 vCPU / 16 GB: 6)"
        required: false
        default: "6"
        type: string

concurrency:
  group: daf-build
  cancel-in-progress: false

permissions:
  contents: read

env:
  WORKSPACE: chromium
  OUT_DIR: chromium/chromium/src/out/daf-release

jobs:
  hop:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          df -h
          # The hosted Android SDK is removed: the build uses Chromium's own
          # SDK from the checkout (third_party/android_sdk), not the hosted one.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          df -h

      - name: Add 14 GiB swap
        run: |
          # iNWEB: the link needs swap on a 16 GB runner (they used -j6 + 14 GiB).
          sudo fallocate -l 14G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Fetch Chromium + apply Bare patches
        run: |
          bash scripts/fetch.sh
          echo "$GITHUB_WORKSPACE/chromium/depot_tools" >> "$GITHUB_PATH"

      - name: Download the previous run's verdict (the gate)
        uses: actions/download-artifact@v4
        with:
          name: daf-verdict
          run-id: ${{ inputs.prev_run_id }}
          path: verdict/
          github-token: ${{ github.token }}

      - name: Gate — refuse unless the previous run produced resumable state
        run: |
          VERDICT="$(head -1 verdict/verdict.txt | tr -d '[:space:]')"
          echo "Previous run verdict: $VERDICT (run ${{ inputs.prev_run_id }})"
          case "$VERDICT" in
            HINGE_TIMEOUT|HOP_TIMEOUT)
              echo "Gate open: resuming from run ${{ inputs.prev_run_id }}."
              ;;
            HINGE_DEAD|HOP_FAILED|HINGE_BLOCKED|HOP_BLOCKED)
              echo "GATE CLOSED: the previous run recorded $VERDICT — a real failure or a blocked state. Do not resume." >&2
              exit 1
              ;;
            HINGE_PASSED|HOP_DONE)
              echo "GATE CLOSED: the build already completed in run ${{ inputs.prev_run_id }} — the APK is in that run's artifacts. Nothing to resume." >&2
              exit 1
              ;;
            *)
              echo "GATE CLOSED: unknown verdict '$VERDICT'. Run the hinge workflow first." >&2
              exit 1
              ;;
          esac

      - name: Normalise tree mtimes to 2020-01-01
        run: |
          # Must run BEFORE the state is restored: the restored out/ artifacts
          # must stay newer than the tree, or plain ninja rebuilds everything.
          find "$WORKSPACE" -path '*/.git' -prune -o -type f -exec touch -h -d '2020-01-01 UTC' {} +
          echo "mtime normalisation done"

      - name: Download the previous hop's state parts
        uses: actions/download-artifact@v4
        with:
          pattern: daf-state-part-*
          run-id: ${{ inputs.prev_run_id }}
          path: state/
          merge-multiple: true
          github-token: ${{ github.token }}

      - name: Download the previous hop's state manifest
        uses: actions/download-artifact@v4
        with:
          name: daf-state-manifest
          run-id: ${{ inputs.prev_run_id }}
          path: state/
          github-token: ${{ github.token }}

      - name: Restore the previous hop's state
        run: bash scripts/restore-state.sh state/ chromium/chromium/src/out

      - name: Install Android build dependencies
        run: sudo bash chromium/chromium/src/build/install-build-deps.sh --android --no-arm

      - name: Configure (gn gen, minimal release config)
        run: bash scripts/configure.sh

      - name: Probe dry-run (plan only, no compile)
        run: |
          DRYRUN=1 bash scripts/build-hop.sh "$OUT_DIR" 1 | tee "hop-${{ inputs.hop_number }}-dryrun.log"

      - name: Hop build — chrome_public_apk, time-boxed
        id: hop-build
        run: |
          # The step itself never fails: the verdict steps below decide what
          # the exit code means (0 = done, 124 = expected timeout, else failed).
          set +e
          bash scripts/build-hop.sh "$OUT_DIR" "${{ inputs.hop_minutes }}" "${{ inputs.ninja_jobs }}" 2>&1 | tee "hop-${{ inputs.hop_number }}-build.log"
          EC=${PIPESTATUS[0]}
          set -e
          echo "BUILD_EC=$EC" >> "$GITHUB_ENV"
          echo "build_ec=$EC" >> "$GITHUB_OUTPUT"
          if [ "$EC" -eq 0 ]; then
            echo "HOP ${{ inputs.hop_number }}: build finished (exit 0)"
          elif [ "$EC" -eq 124 ]; then
            echo "HOP ${{ inputs.hop_number }}: time box expired — state will be packaged for the next hop"
          else
            echo "HOP ${{ inputs.hop_number }}: real build failure (exit $EC)"
          fi
          exit 0

      - name: Verdict — DONE (APK produced)
        if: env.BUILD_EC == '0'
        run: |
          ls -lh "$OUT_DIR/apks/ChromePublic.apk"
          test -s "$OUT_DIR/apks/ChromePublic.apk"
          {
            echo "HOP_DONE"
            echo "Hop ${{ inputs.hop_number }} finished the build. The stripped release link completed: the \$0 path is proven."
          } > verdict.txt

      - name: Sign the APK (only if the release keystore secrets exist)
        if: env.BUILD_EC == '0' && secrets.DAF_RELEASE_KEYSTORE_BASE64 != ''
        run: |
          KEYSTORE_TMP="$(mktemp)"
          trap 'rm -f "$KEYSTORE_TMP"' EXIT
          echo "${{ secrets.DAF_RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$KEYSTORE_TMP"
          APKSIGNER="$(find chromium/chromium/src/third_party/android_sdk -name apksigner -type f | head -1)"
          test -n "$APKSIGNER" || { echo "ERROR: apksigner not found in the checkout SDK" >&2; exit 1; }
          export APKSIGNER
          export DAF_KEYSTORE_PASS="${{ secrets.DAF_KEYSTORE_PASS }}"
          export DAF_KEY_ALIAS="${{ secrets.DAF_KEY_ALIAS }}"
          export DAF_KEY_PASS="${{ secrets.DAF_KEY_PASS }}"
          MAJOR="$(sed -n 's/^MAJOR=//p' VERSION | tr -d '[:space:]')"
          MINOR="$(sed -n 's/^MINOR=//p' VERSION | tr -d '[:space:]')"
          PATCH="$(sed -n 's/^PATCH=//p' VERSION | tr -d '[:space:]')"
          bash scripts/package-release.sh "$OUT_DIR" "$KEYSTORE_TMP" "DAF-Browser-fork-$MAJOR.$MINOR.$PATCH-arm64.apk"

      - name: Upload signed APK
        if: env.BUILD_EC == '0' && secrets.DAF_RELEASE_KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: daf-release-apk
          path: DAF-Browser-fork-*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload unsigned APK (no keystore secrets yet)
        if: env.BUILD_EC == '0' && secrets.DAF_RELEASE_KEYSTORE_BASE64 == ''
        run: |
          cp "$OUT_DIR/apks/ChromePublic.apk" DAF-Browser-fork-unsigned.apk
          echo "NOTE: no release keystore secrets are set, so this APK is unsigned." >> verdict.txt
          echo "Add DAF_RELEASE_KEYSTORE_BASE64 + DAF_KEYSTORE_PASS + DAF_KEY_ALIAS + DAF_KEY_PASS as repository secrets, then sign the artifact locally (see BUILDING.md)." >> verdict.txt
      - name: Upload unsigned APK artifact
        if: env.BUILD_EC == '0' && secrets.DAF_RELEASE_KEYSTORE_BASE64 == ''
        uses: actions/upload-artifact@v4
        with:
          name: daf-release-apk-unsigned
          path: DAF-Browser-fork-unsigned.apk
          if-no-files-found: error
          retention-days: 90

      - name: Verdict — TIMEOUT (package the state for the next hop)
        if: env.BUILD_EC == '124'
        run: |
          set +e
          bash scripts/package-state.sh "$OUT_DIR" state-out
          EC=$?
          set -e
          if [ "$EC" -eq 2 ]; then
            {
              echo "HOP_BLOCKED"
              echo "The state no longer fits the 8-part (32 GiB) upload scheme. The chain cannot continue. The \$0 path is blocked in this form."
            } > verdict.txt
            echo "STATE BLOCKED — see the verdict." >&2
            exit 1
          elif [ "$EC" -ne 0 ]; then
            echo "ERROR: packaging the state failed (exit $EC)" >&2
            exit "$EC"
          fi
          {
            echo "HOP_TIMEOUT"
            echo "Hop ${{ inputs.hop_number }} timed out. The state is packaged; run the next hop with this run's ID as prev_run_id."
          } > verdict.txt

      - name: Upload state parts (timeout case)
        if: env.BUILD_EC == '124'
        uses: actions/upload-artifact@v4
        with:
          name: daf-state-part-00
          path: state-out/part-00
          if-no-files-found: ignore
          retention-days: 90
      - name: Upload state part 01
        if: env.BUILD_EC == '124'
        uses: actions/upload-artifact@v4
        with:
          name: daf-state-part-01
          path: state-out/part-01
          if-no-files-found: ignore
          retention-days: 90
      - name: Upload state part 02
        if: env.BUILD_EC == '124'
        uses: actions/upload-artifact@v4
        with:
          name: daf-state-part-02
          path: state-out/part-02
          if-no-files-found: ignore
          retention-days: 90
      - name: Upload state part 03
        if: env.BUILD_EC == '124'
        uses: actions/upload-artifact@v4
        with:
          name: daf-state-part-03
          path: state-out/part-03
          if-no-files-found: ignore
          retention-days: 90
      - name: Upload state part 04
        if: env.BUILD_EC == '124'
        uses: actions/upload-artifact@v4
        with:
          name: daf-state-part-04
          path: state-out/part-04
          if-no-files-found: ignore
          retention-days: 90
      - name: Upload state part 05
        if: env.BUILD_EC == '124'
        uses: actions/upload-artifact@v4
        with:
          name: daf-state-part-05
          path: state-out/part-05
          if-no-files-found: ignore
          retention-days: 90
      - name: Upload state part 06
        if: env.BUILD_EC == '124'
        uses: actions/upload-artifact@v4
        with:
          name: daf-state-part-06
          path: state-out/part-06
          if-no-files-found: ignore
          retention-days: 90
      - name: Upload state part 07
        if: env.BUILD_EC == '124'
        uses: actions/upload-artifact@v4
        with:
          name: daf-state-part-07
          path: state-out/part-07
          if-no-files-found: ignore
          retention-days: 90
      - name: Upload state manifest (timeout case)
        if: env.BUILD_EC == '124'
        uses: actions/upload-artifact@v4
        with:
          name: daf-state-manifest
          path: state-out/manifest.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Verdict — FAILED (real build failure)
        if: env.BUILD_EC != '0' && env.BUILD_EC != '124'
        run: |
          {
            echo "HOP_FAILED"
            echo "Hop ${{ inputs.hop_number }} failed with exit code $BUILD_EC (not a timeout). No state is uploaded — re-running the same step would fail again. See hop-${{ inputs.hop_number }}-build.log."
          } > verdict.txt
          echo "HOP FAILED — see the verdict and the build log." >&2
          exit 1

      - name: Upload verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daf-verdict
          path: verdict.txt
          if-no-files-found: error
          retention-days: 90

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hop-build-log
          path: |
            hop-${{ inputs.hop_number }}-build.log
            hop-${{ inputs.hop_number }}-dryrun.log
          if-no-files-found: ignore
          retention-days: 90
